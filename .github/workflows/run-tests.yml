# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test the package

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ 'ubuntu-latest', 'macos-latest' ]
        python-version: [ 'latest', 'oldest' ]

    name: ${{ matrix.os }}, ${{ matrix.python-version }} Python
    steps:
      - uses: actions/checkout@v7

      - name: Find supported Python
        uses: BiocPy/find-supported-python@v1
        id: find-version
        with:
          which: ${{ matrix.python-version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.find-version.outputs.version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest tox

      - name: Cache sources
        id: cache-sources
        uses: actions/cache@v6
        with:
          path: extern/_sources
          key: sources-${{ hashFiles('extern/manifest.csv') }}

      - name: Fetch C++ dependencies
        run: | 
          cd extern
          ./fetch.py

      - name: Test with tox
        run: |
          tox
